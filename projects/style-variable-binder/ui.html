<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Style Variable Binder v2.1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      color: #333;
      background: #f5f5f5;
    }

    /* ========== 顶部统计卡片 ========== */
    .stats-bar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: white;
      border-bottom: 1px solid #e5e5e5;
    }

    .stat-card {
      flex: 1;
      padding: 10px 12px;
      background: #f8f9fa;
      border-radius: 8px;
      text-align: center;
    }

    .stat-card .number {
      font-size: 20px;
      font-weight: 600;
      color: #1161fe;
    }

    .stat-card .label {
      font-size: 10px;
      color: #666;
      margin-top: 2px;
    }

    .stat-card.success .number { color: #00b42a; }
    .stat-card.warning .number { color: #ff9500; }
    .stat-card.info .number { color: #1161fe; }
    .stat-card.danger .number { color: #ff4d4f; }
    .stat-card.danger { background: #fff0f0; }

    /* ========== 标签页 ========== */
    .tabs {
      display: flex;
      background: white;
      border-bottom: 1px solid #e5e5e5;
      position: sticky;
      top: 0;
      z-index: 101;
    }

    .tab {
      flex: 1;
      padding: 12px 16px;
      border: none;
      background: none;
      font-size: 12px;
      font-weight: 500;
      color: #666;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab:hover { color: #1161fe; }
    .tab.active { color: #1161fe; border-bottom-color: #1161fe; }

    .tab-badge {
      display: inline-block;
      background: #e5e5e5;
      color: #666;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      margin-left: 4px;
    }

    .tab.active .tab-badge { background: #e6f0ff; color: #1161fe; }

    /* ========== 工具栏 ========== */
    .toolbar {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background: white;
      border-bottom: 1px solid #e5e5e5;
      flex-wrap: wrap;
      position: sticky;
      top: 46px;
      z-index: 100;
    }

    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary { background: #1161fe; color: white; }
    .btn-primary:hover { background: #0052cc; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
    .btn-secondary { background: #f0f0f0; color: #333; }
    .btn-secondary:hover { background: #e0e0e0; }
    .btn-danger { background: #ff4d4f; color: white; }
    .btn-danger:hover { background: #d9363e; }
    .btn-danger:disabled { background: #ccc; cursor: not-allowed; }

    .toolbar-spacer { flex: 1; }

    /* ========== 字段筛选栏 ========== */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: #fafafa;
      border-bottom: 1px solid #e5e5e5;
    }

    .filter-label {
      font-size: 11px;
      color: #666;
      margin-right: 4px;
    }

    .filter-btn {
      padding: 4px 10px;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      background: white;
      font-size: 10px;
      color: #666;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover { border-color: #1161fe; color: #1161fe; }
    .filter-btn.active { background: #1161fe; color: white; border-color: #1161fe; }

    /* ========== 列表区域 ========== */
    .list { padding: 8px 12px; }

    /* ========== 分组 ========== */
    .group {
      margin-bottom: 8px;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e5e5e5;
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #fafafa;
      cursor: pointer;
      user-select: none;
    }

    .group-header:hover { background: #f5f5f5; }

    .group-select-all {
      padding: 2px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: white;
      font-size: 10px;
      color: #666;
      cursor: pointer;
      margin-left: 8px;
    }

    .group-select-all:hover { border-color: #1161fe; color: #1161fe; }

    .group-toggle {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      transition: transform 0.2s;
    }

    .group.collapsed .group-toggle { transform: rotate(-90deg); }

    .group-name {
      font-weight: 600;
      font-size: 11px;
      color: #333;
    }

    .group-count {
      font-size: 10px;
      color: #999;
      background: #eee;
      padding: 2px 6px;
      border-radius: 10px;
    }

    .group-stats {
      display: flex;
      gap: 8px;
      margin-left: auto;
      font-size: 10px;
    }

    .group-stat {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .group-stat-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .group-stat-dot.exact { background: #00b42a; }
    .group-stat-dot.close { background: #ff9500; }
    .group-stat-dot.bound { background: #1161fe; }
    .group-stat-dot.orphan { background: #ff4d4f; }

    .group-items { }
    .group.collapsed .group-items { display: none; }

    /* ========== 列表项（紧凑布局）========== */
    .item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.15s;
    }

    .item:last-child { border-bottom: none; }
    .item:hover { background: #fafafa; }
    .item.selected { background: #f0f7ff; }
    .item.bound { background: #f0fff4; }
    .item.orphan { background: #fff0f0; border-left: 3px solid #ff4d4f; }
    .item.skip { opacity: 0.5; }

    .checkbox { width: 14px; height: 14px; cursor: pointer; flex-shrink: 0; }

    /* ========== 颜色对比条 ========== */
    .color-compare {
      width: 60px;
      height: 24px;
      border-radius: 4px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.1);
    }

    .color-compare .from {
      position: absolute;
      left: 0;
      top: 0;
      width: 50%;
      height: 100%;
    }

    .color-compare .to {
      position: absolute;
      right: 0;
      top: 0;
      width: 50%;
      height: 100%;
    }

    .color-compare .divider {
      position: absolute;
      left: 50%;
      top: 0;
      width: 1px;
      height: 100%;
      background: rgba(255,255,255,0.5);
    }

    /* ========== 信息区域 ========== */
    .info-section {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .style-name {
      font-weight: 500;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }

    .arrow {
      color: #ccc;
      font-size: 12px;
      flex-shrink: 0;
    }

    .var-name {
      font-size: 11px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }

    .var-name.none { color: #999; font-style: italic; }

    /* ========== 匹配度指示器 ========== */
    .match-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .match-bar {
      width: 40px;
      height: 4px;
      background: #eee;
      border-radius: 2px;
      overflow: hidden;
    }

    .match-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s;
    }

    .match-bar-fill.exact { background: #00b42a; }
    .match-bar-fill.close { background: #ff9500; }
    .match-bar-fill.far { background: #ff4d4f; }
    .match-bar-fill.bound { background: #1161fe; }

    .match-tag {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 8px;
      font-weight: 500;
      white-space: nowrap;
    }

    .match-tag.exact { background: #e6f9ed; color: #00b42a; }
    .match-tag.exact_name { background: #d4f4e2; color: #00994d; }
    .match-tag.close { background: #fff7e6; color: #ff9500; }
    .match-tag.close_name { background: #ffeccc; color: #cc7700; }
    .match-tag.far { background: #ffebe6; color: #ff4d4f; }
    .match-tag.bound { background: #e6f0ff; color: #1161fe; }
    .match-tag.orphan { background: #ff4d4f; color: white; }
    .match-tag.skip { background: #f0f0f0; color: #999; }

    .name-match-badge {
      font-size: 8px;
      color: #00b42a;
      margin-left: 2px;
    }

    /* ========== 字段标签（Text Style）========== */
    .field-tag {
      font-size: 9px;
      padding: 2px 5px;
      border-radius: 4px;
      background: #f0f0f0;
      color: #666;
      flex-shrink: 0;
    }

    .value-tag {
      font-family: Monaco, monospace;
      font-size: 9px;
      color: #666;
      background: #f5f5f5;
      padding: 2px 4px;
      border-radius: 3px;
    }

    /* ========== Toast ========== */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 1000;
      animation: fadeIn 0.3s;
    }

    .toast.success { background: #00b42a; }
    .toast.warning { background: #ff9500; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ========== 空状态 ========== */
    .empty, .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }
  </style>
</head>
<body>
  <!-- 统计卡片 -->
  <div class="stats-bar">
    <div class="stat-card danger" id="orphanCard" style="display:none;">
      <div class="number" id="orphanTotal">0</div>
      <div class="label">绑定失效</div>
    </div>
    <div class="stat-card success">
      <div class="number" id="exactTotal">0</div>
      <div class="label">精确匹配</div>
    </div>
    <div class="stat-card warning">
      <div class="number" id="closeTotal">0</div>
      <div class="label">相近匹配</div>
    </div>
    <div class="stat-card info">
      <div class="number" id="boundTotal">0</div>
      <div class="label">已绑定</div>
    </div>
    <div class="stat-card">
      <div class="number" id="totalStyles">0</div>
      <div class="label">Style 总数</div>
    </div>
  </div>

  <!-- 标签页 -->
  <div class="tabs">
    <button class="tab active" data-tab="paint">
      颜色样式 <span class="tab-badge" id="paintCount">0</span>
    </button>
    <button class="tab" data-tab="text">
      文字样式 <span class="tab-badge" id="textCount">0</span>
    </button>
  </div>

  <!-- 工具栏 -->
  <div class="toolbar">
    <button class="btn btn-primary" id="bindSelected" disabled>绑定 (0)</button>
    <button class="btn btn-danger" id="unbindSelected" disabled>解绑 (0)</button>
    <button class="btn btn-secondary" id="selectOrphan">选失效</button>
    <button class="btn btn-secondary" id="selectExact">选精确</button>
    <button class="btn btn-secondary" id="selectNameMatch">选名称</button>
    <button class="btn btn-secondary" id="selectBound">选已绑</button>
    <button class="btn btn-secondary" id="selectNone">清除</button>
    <div class="toolbar-spacer"></div>
    <button class="btn btn-secondary" id="expandAll">展开</button>
    <button class="btn btn-secondary" id="collapseAll">折叠</button>
    <button class="btn btn-secondary" id="refresh">刷新</button>
  </div>

  <!-- 字段筛选（仅 Text Style） -->
  <div class="filter-bar" id="filterBar" style="display:none;">
    <span class="filter-label">筛选字段：</span>
    <button class="filter-btn active" data-field="all">全部</button>
    <button class="filter-btn" data-field="fontSize">字号</button>
    <button class="filter-btn" data-field="fontWeight">字重</button>
    <button class="filter-btn" data-field="lineHeight">行高</button>
    <button class="filter-btn" data-field="letterSpacing">字间距</button>
  </div>

  <!-- 列表 -->
  <div class="list" id="list">
    <div class="loading">加载中...</div>
  </div>

  <div id="toast" class="toast" style="display: none;"></div>

  <script>
    var paintMatches = [];
    var textMatches = [];
    var selected = {};
    var currentTab = 'paint';
    var collapsedGroups = {};
    var currentFilter = 'all'; // 字段筛选

    function showToast(message, type) {
      var toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast' + (type ? ' ' + type : '');
      toast.style.display = 'block';
      setTimeout(function() { toast.style.display = 'none'; }, 3000);
    }

    function getMatchLabel(matchType) {
      var labels = {
        'exact': '精确',
        'exact_name': '精确+名称',
        'close': '相近',
        'close_name': '相近+名称',
        'far': '差异大',
        'bound': '已绑定',
        'orphan': '绑定失效',
        'skip': '跳过'
      };
      return labels[matchType] || matchType;
    }

    function getFieldLabel(field) {
      var labels = {
        'color': '颜色',
        'fontSize': '字号',
        'fontWeight': '字重',
        'lineHeight': '行高',
        'letterSpacing': '字间距'
      };
      return labels[field] || field;
    }

    function getMatchBarWidth(matchType, distance) {
      if (matchType === 'bound') return 100;
      if (matchType.indexOf('exact') >= 0) return 100;
      if (matchType.indexOf('close') >= 0) return 70;
      if (matchType === 'far') return 30;
      return 0;
    }

    function getMatchBarClass(matchType) {
      if (matchType === 'bound') return 'bound';
      if (matchType.indexOf('exact') >= 0) return 'exact';
      if (matchType.indexOf('close') >= 0) return 'close';
      return 'far';
    }

    function getCurrentMatches() {
      var matches = currentTab === 'paint' ? paintMatches : textMatches;
      // 应用字段筛选（仅 Text Style）
      if (currentTab === 'text' && currentFilter !== 'all') {
        var filtered = [];
        for (var i = 0; i < matches.length; i++) {
          if (matches[i].field === currentFilter) {
            filtered.push(matches[i]);
          }
        }
        return filtered;
      }
      return matches;
    }

    function getItemKey(match) {
      return match.style.id + '_' + match.field;
    }

    function getGroupName(styleName) {
      var parts = styleName.split('/');
      return parts.length > 1 ? parts[0] : '其他';
    }

    function groupMatches(matches) {
      var groups = {};
      for (var i = 0; i < matches.length; i++) {
        var m = matches[i];
        var groupName = getGroupName(m.style.name);
        if (!groups[groupName]) {
          groups[groupName] = [];
        }
        groups[groupName].push(m);
      }
      return groups;
    }

    function getGroupStats(items) {
      var stats = { exact: 0, close: 0, bound: 0, orphan: 0 };
      for (var i = 0; i < items.length; i++) {
        var m = items[i];
        if (m.matchType === 'orphan') stats.orphan++;
        else if (m.matchType === 'bound') stats.bound++;
        else if (m.matchType.indexOf('exact') >= 0) stats.exact++;
        else if (m.matchType.indexOf('close') >= 0) stats.close++;
      }
      return stats;
    }

    function renderList() {
      var list = document.getElementById('list');
      var matches = getCurrentMatches();

      if (matches.length === 0) {
        list.innerHTML = '<div class="empty">没有匹配项</div>';
        updateStats();
        return;
      }

      var groups = groupMatches(matches);
      var groupNames = Object.keys(groups).sort();
      var html = '';

      for (var g = 0; g < groupNames.length; g++) {
        var groupName = groupNames[g];
        var groupItems = groups[groupName];
        var groupStats = getGroupStats(groupItems);
        var isCollapsed = collapsedGroups[currentTab + '_' + groupName];

        html += '<div class="group' + (isCollapsed ? ' collapsed' : '') + '" data-group="' + groupName + '">';

        // 分组头部
        html += '<div class="group-header">';
        html += '<div class="group-toggle">▼</div>';
        html += '<div class="group-name">' + groupName + '</div>';
        html += '<div class="group-count">' + groupItems.length + '</div>';
        html += '<button class="group-select-all" data-group="' + groupName + '">全选</button>';
        html += '<div class="group-stats">';
        if (groupStats.orphan > 0) html += '<div class="group-stat"><div class="group-stat-dot orphan"></div>' + groupStats.orphan + '</div>';
        if (groupStats.exact > 0) html += '<div class="group-stat"><div class="group-stat-dot exact"></div>' + groupStats.exact + '</div>';
        if (groupStats.close > 0) html += '<div class="group-stat"><div class="group-stat-dot close"></div>' + groupStats.close + '</div>';
        if (groupStats.bound > 0) html += '<div class="group-stat"><div class="group-stat-dot bound"></div>' + groupStats.bound + '</div>';
        html += '</div></div>';

        // 分组内容
        html += '<div class="group-items">';
        for (var i = 0; i < groupItems.length; i++) {
          html += renderItem(groupItems[i]);
        }
        html += '</div></div>';
      }

      list.innerHTML = html;
      bindEvents();
      updateStats();
    }

    function renderItem(match) {
      var style = match.style;
      var variable = match.variable;
      var key = getItemKey(match);
      var isSelected = selected[key];
      var isBound = match.matchType === 'bound';
      var isOrphan = match.matchType === 'orphan';
      var isSkip = match.matchType === 'skip';
      var canSelect = !isSkip; // orphan 可以选中

      var itemClass = 'item';
      if (isBound) itemClass += ' bound';
      if (isOrphan) itemClass += ' orphan';
      if (isSkip) itemClass += ' skip';
      if (isSelected) itemClass += ' selected';

      var html = '<div class="' + itemClass + '" data-key="' + key + '">';
      html += '<input type="checkbox" class="checkbox" ' + (isSelected ? 'checked' : '') + ' ' + (canSelect ? '' : 'disabled') + '>';

      // 颜色对比条（仅 Paint Style）
      if (currentTab === 'paint' && style.hex) {
        var varHex = variable && variable.hex ? variable.hex : style.hex;
        html += '<div class="color-compare">';
        html += '<div class="from" style="background:' + style.hex + '"></div>';
        html += '<div class="to" style="background:' + varHex + '"></div>';
        html += '<div class="divider"></div>';
        html += '</div>';
      }

      // 字段标签（仅 Text Style）
      if (currentTab === 'text') {
        html += '<span class="field-tag">' + getFieldLabel(match.field) + '</span>';
        if (match.fieldValue !== undefined && match.fieldValue !== null) {
          html += '<span class="value-tag">' + match.fieldValue + '</span>';
        }
      }

      // 信息区域
      html += '<div class="info-section">';
      var displayName = style.name.indexOf('/') > 0 ? style.name.split('/').slice(1).join('/') : style.name;
      html += '<span class="style-name" title="' + style.name + '">' + displayName + '</span>';
      html += '<span class="arrow">→</span>';

      if (variable) {
        html += '<span class="var-name" title="' + variable.name + '">' + variable.name;
        if (match.nameMatched) {
          html += '<span class="name-match-badge">✓</span>';
        }
        html += '</span>';
      } else {
        html += '<span class="var-name none">' + (match.reason || '无匹配') + '</span>';
      }
      html += '</div>';

      // 匹配度指示器
      html += '<div class="match-indicator">';
      var barWidth = getMatchBarWidth(match.matchType, match.distance);
      var barClass = getMatchBarClass(match.matchType);
      html += '<div class="match-bar"><div class="match-bar-fill ' + barClass + '" style="width:' + barWidth + '%"></div></div>';
      html += '<span class="match-tag ' + match.matchType + '">' + getMatchLabel(match.matchType) + '</span>';
      html += '</div>';

      html += '</div>';
      return html;
    }

    function bindEvents() {
      // Checkbox 事件
      var items = document.querySelectorAll('.item');
      for (var j = 0; j < items.length; j++) {
        (function(item) {
          var checkbox = item.querySelector('.checkbox');
          if (checkbox && !checkbox.disabled) {
            checkbox.addEventListener('change', function(e) {
              var key = item.dataset.key;
              if (e.target.checked) {
                selected[key] = true;
                item.classList.add('selected');
              } else {
                delete selected[key];
                item.classList.remove('selected');
              }
              updateBindButton();
            });
          }
        })(items[j]);
      }

      // 分组折叠事件
      var groupHeaders = document.querySelectorAll('.group-header');
      for (var g = 0; g < groupHeaders.length; g++) {
        (function(header) {
          header.addEventListener('click', function(e) {
            // 如果点击的是全选按钮，不处理折叠
            if (e.target.classList.contains('group-select-all')) return;
            var group = header.parentElement;
            var groupName = group.dataset.group;
            group.classList.toggle('collapsed');
            collapsedGroups[currentTab + '_' + groupName] = group.classList.contains('collapsed');
          });
        })(groupHeaders[g]);
      }
    }

    // 使用事件委托处理分组全选（在 list 容器上绑定一次）
    document.getElementById('list').addEventListener('click', function(e) {
      if (e.target.classList.contains('group-select-all')) {
        e.stopPropagation();
        var groupName = e.target.dataset.group;
        var matches = getCurrentMatches();

        // 检查该分组是否已全选
        var allSelected = true;
        var selectableCount = 0;
        for (var i = 0; i < matches.length; i++) {
          var m = matches[i];
          var mGroupName = getGroupName(m.style.name);
          if (mGroupName === groupName && m.matchType !== 'skip') {
            selectableCount++;
            if (!selected[getItemKey(m)]) {
              allSelected = false;
            }
          }
        }

        // 切换选择状态
        for (var i = 0; i < matches.length; i++) {
          var m = matches[i];
          var mGroupName = getGroupName(m.style.name);
          if (mGroupName === groupName && m.matchType !== 'skip') {
            if (allSelected && selectableCount > 0) {
              // 全部已选，点击则取消
              delete selected[getItemKey(m)];
            } else {
              // 未全选，点击则全选
              selected[getItemKey(m)] = true;
            }
          }
        }
        renderList();
        updateBindButton();
      }
    });

    function updateBindButton() {
      var allMatches = paintMatches.concat(textMatches);
      var bindCount = 0;
      var unbindCount = 0;

      for (var key in selected) {
        for (var i = 0; i < allMatches.length; i++) {
          var m = allMatches[i];
          if (getItemKey(m) === key) {
            if (m.matchType === 'bound') {
              unbindCount++;
            } else if (m.matchType === 'orphan' && m.variable) {
              // orphan 有推荐变量时可以重新绑定
              bindCount++;
            } else if (m.variable && m.matchType !== 'bound') {
              bindCount++;
            }
            break;
          }
        }
      }

      var bindBtn = document.getElementById('bindSelected');
      var unbindBtn = document.getElementById('unbindSelected');

      bindBtn.textContent = '绑定 (' + bindCount + ')';
      bindBtn.disabled = bindCount === 0;

      unbindBtn.textContent = '解绑 (' + unbindCount + ')';
      unbindBtn.disabled = unbindCount === 0;
    }

    function updateStats() {
      var allMatches = paintMatches.concat(textMatches);
      var exact = 0, close = 0, bound = 0, orphan = 0;

      for (var i = 0; i < allMatches.length; i++) {
        var m = allMatches[i];
        if (m.matchType === 'orphan') orphan++;
        else if (m.matchType === 'bound') bound++;
        else if (m.matchType.indexOf('exact') >= 0) exact++;
        else if (m.matchType.indexOf('close') >= 0) close++;
      }

      document.getElementById('orphanTotal').textContent = orphan;
      document.getElementById('exactTotal').textContent = exact;
      document.getElementById('closeTotal').textContent = close;
      document.getElementById('boundTotal').textContent = bound;
      document.getElementById('totalStyles').textContent = paintMatches.length + textMatches.length;

      // 只有有失效绑定时才显示
      document.getElementById('orphanCard').style.display = orphan > 0 ? 'block' : 'none';
    }

    function updateTabCounts() {
      document.getElementById('paintCount').textContent = paintMatches.length;
      document.getElementById('textCount').textContent = textMatches.length;
    }

    // ========== 事件绑定 ==========

    // Tab 切换
    var tabs = document.querySelectorAll('.tab');
    for (var t = 0; t < tabs.length; t++) {
      tabs[t].addEventListener('click', function() {
        for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
        this.classList.add('active');
        currentTab = this.dataset.tab;
        currentFilter = 'all';
        selected = {};
        // 只在 Text 标签页显示筛选栏
        document.getElementById('filterBar').style.display = currentTab === 'text' ? 'flex' : 'none';
        // 重置筛选按钮状态
        var filterBtns = document.querySelectorAll('.filter-btn');
        for (var i = 0; i < filterBtns.length; i++) {
          filterBtns[i].classList.toggle('active', filterBtns[i].dataset.field === 'all');
        }
        renderList();
        updateBindButton();
      });
    }

    // 选择失效（切换模式）
    document.getElementById('selectOrphan').addEventListener('click', function() {
      var matches = getCurrentMatches();
      var orphanKeys = [];
      var selectedCount = 0;

      // 统计失效项
      for (var i = 0; i < matches.length; i++) {
        var m = matches[i];
        if (m.matchType === 'orphan' && m.variable) {
          orphanKeys.push(getItemKey(m));
          if (selected[orphanKeys[orphanKeys.length - 1]]) {
            selectedCount++;
          }
        }
      }

      // 切换选择
      if (selectedCount === orphanKeys.length && orphanKeys.length > 0) {
        // 已全选，则取消
        for (var i = 0; i < orphanKeys.length; i++) {
          delete selected[orphanKeys[i]];
        }
      } else {
        // 未全选，则全选
        for (var i = 0; i < orphanKeys.length; i++) {
          selected[orphanKeys[i]] = true;
        }
      }
      renderList();
      updateBindButton();
    });

    // 字段筛选
    var filterBtns = document.querySelectorAll('.filter-btn');
    for (var f = 0; f < filterBtns.length; f++) {
      filterBtns[f].addEventListener('click', function() {
        for (var i = 0; i < filterBtns.length; i++) filterBtns[i].classList.remove('active');
        this.classList.add('active');
        currentFilter = this.dataset.field;
        selected = {};
        renderList();
        updateBindButton();
      });
    }

    // 选择精确匹配（切换模式）
    document.getElementById('selectExact').addEventListener('click', function() {
      var matches = getCurrentMatches();
      var exactKeys = [];
      var selectedCount = 0;

      for (var i = 0; i < matches.length; i++) {
        var m = matches[i];
        if (m.variable && m.matchType.indexOf('exact') >= 0) {
          exactKeys.push(getItemKey(m));
          if (selected[exactKeys[exactKeys.length - 1]]) {
            selectedCount++;
          }
        }
      }

      if (selectedCount === exactKeys.length && exactKeys.length > 0) {
        for (var i = 0; i < exactKeys.length; i++) {
          delete selected[exactKeys[i]];
        }
      } else {
        for (var i = 0; i < exactKeys.length; i++) {
          selected[exactKeys[i]] = true;
        }
      }
      renderList();
      updateBindButton();
    });

    // 选择名称匹配（切换模式）
    document.getElementById('selectNameMatch').addEventListener('click', function() {
      var matches = getCurrentMatches();
      var nameMatchKeys = [];
      var selectedCount = 0;

      for (var i = 0; i < matches.length; i++) {
        var m = matches[i];
        if (m.variable && m.nameMatched && m.matchType !== 'bound') {
          nameMatchKeys.push(getItemKey(m));
          if (selected[nameMatchKeys[nameMatchKeys.length - 1]]) {
            selectedCount++;
          }
        }
      }

      if (selectedCount === nameMatchKeys.length && nameMatchKeys.length > 0) {
        for (var i = 0; i < nameMatchKeys.length; i++) {
          delete selected[nameMatchKeys[i]];
        }
      } else {
        for (var i = 0; i < nameMatchKeys.length; i++) {
          selected[nameMatchKeys[i]] = true;
        }
      }
      renderList();
      updateBindButton();
    });

    // 选择已绑定（切换模式）
    document.getElementById('selectBound').addEventListener('click', function() {
      var matches = getCurrentMatches();
      var boundKeys = [];
      var selectedCount = 0;

      for (var i = 0; i < matches.length; i++) {
        var m = matches[i];
        if (m.matchType === 'bound') {
          boundKeys.push(getItemKey(m));
          if (selected[boundKeys[boundKeys.length - 1]]) {
            selectedCount++;
          }
        }
      }

      if (selectedCount === boundKeys.length && boundKeys.length > 0) {
        for (var i = 0; i < boundKeys.length; i++) {
          delete selected[boundKeys[i]];
        }
      } else {
        for (var i = 0; i < boundKeys.length; i++) {
          selected[boundKeys[i]] = true;
        }
      }
      renderList();
      updateBindButton();
    });

    // 清除选择
    document.getElementById('selectNone').addEventListener('click', function() {
      selected = {};
      renderList();
      updateBindButton();
    });

    // 展开全部
    document.getElementById('expandAll').addEventListener('click', function() {
      collapsedGroups = {};
      var groups = document.querySelectorAll('.group');
      for (var i = 0; i < groups.length; i++) {
        groups[i].classList.remove('collapsed');
      }
    });

    // 折叠全部
    document.getElementById('collapseAll').addEventListener('click', function() {
      var groups = document.querySelectorAll('.group');
      for (var i = 0; i < groups.length; i++) {
        groups[i].classList.add('collapsed');
        collapsedGroups[currentTab + '_' + groups[i].dataset.group] = true;
      }
    });

    // 绑定选中（包括 orphan 重新绑定）
    document.getElementById('bindSelected').addEventListener('click', function() {
      var items = [];
      var allMatches = paintMatches.concat(textMatches);

      for (var key in selected) {
        for (var i = 0; i < allMatches.length; i++) {
          var m = allMatches[i];
          if (getItemKey(m) === key && m.variable) {
            // orphan 和普通未绑定项都可以绑定
            if (m.matchType === 'orphan' || m.matchType !== 'bound') {
              items.push({
                styleId: m.style.id,
                styleType: m.style.styleType,
                field: m.field,
                variableId: m.variable.id
              });
            }
            break;
          }
        }
      }

      if (items.length > 0) {
        parent.postMessage({ pluginMessage: { type: 'bind-all', items: items } }, '*');
        showToast('正在绑定 ' + items.length + ' 项...');
      }
    });

    // 解除绑定
    document.getElementById('unbindSelected').addEventListener('click', function() {
      var items = [];
      var allMatches = paintMatches.concat(textMatches);

      for (var key in selected) {
        for (var i = 0; i < allMatches.length; i++) {
          var m = allMatches[i];
          if (getItemKey(m) === key && m.matchType === 'bound') {
            items.push({
              styleId: m.style.id,
              styleType: m.style.styleType,
              field: m.field
            });
            break;
          }
        }
      }

      if (items.length > 0) {
        parent.postMessage({ pluginMessage: { type: 'unbind-all', items: items } }, '*');
        showToast('正在解除绑定 ' + items.length + ' 项...');
      }
    });

    // 刷新
    document.getElementById('refresh').addEventListener('click', function() {
      parent.postMessage({ pluginMessage: { type: 'refresh' } }, '*');
      document.getElementById('list').innerHTML = '<div class="loading">加载中...</div>';
    });

    // 接收消息
    window.onmessage = function(event) {
      var msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'init') {
        paintMatches = msg.data.paintMatches || [];
        textMatches = msg.data.textMatches || [];
        selected = {};
        updateTabCounts();
        renderList();
        updateBindButton();

        // 显示孤儿清理提示
        if (msg.data.stats && msg.data.stats.orphansCleared > 0) {
          showToast('已自动清理 ' + msg.data.stats.orphansCleared + ' 个无效绑定', 'success');
        }

        if (msg.data.error) {
          showToast('加载出错: ' + msg.data.error, 'warning');
        }
      }
      else if (msg.type === 'bind-all-result') {
        var success = 0;
        for (var i = 0; i < msg.results.length; i++) {
          if (msg.results[i].success) success++;
        }
        var fail = msg.results.length - success;
        showToast('绑定完成: ' + success + ' 成功' + (fail > 0 ? ', ' + fail + ' 失败' : ''), success > 0 ? 'success' : 'warning');
        selected = {};
        updateBindButton();
      }
      else if (msg.type === 'unbind-all-result') {
        var success = 0;
        for (var i = 0; i < msg.results.length; i++) {
          if (msg.results[i].success) success++;
        }
        var fail = msg.results.length - success;
        showToast('解除绑定完成: ' + success + ' 成功' + (fail > 0 ? ', ' + fail + ' 失败' : ''), success > 0 ? 'success' : 'warning');
        selected = {};
        updateBindButton();
      }
    };

    // UI 准备好后通知插件
    parent.postMessage({ pluginMessage: { type: 'ready' } }, '*');
  </script>
</body>
</html>
