<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>roma · 香气卡片</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="layout">
    <section id="stage">
      <!-- 左侧示例轮播：生成过结果前默认展示，自动切换，点击可在右侧看文字信息 -->
      <div id="carousel" aria-label="示例轮播"></div>

      <!-- 生成中的占位骨架：图片位 + 卡片位，避免空白等待 -->
      <div id="loading" class="hidden">
        <div class="skeleton skeleton-card"></div>
      </div>

      <div id="scene" class="hidden">
        <div id="card" class="card">
          <div class="face front" id="front"></div>
          <div class="face back" id="back"></div>
        </div>
      </div>

      <div class="stage-actions hidden" id="stageActions">
        <button id="flip" type="button">翻面</button>
        <button id="export" type="button">存图片</button>
        <div id="paletteSwitch" class="palette-switch" aria-label="配色风格"></div>
      </div>

      <h2 class="section-label">GALLERY</h2>
      <div id="gallery" aria-label="本地生成记录"></div>
    </section>

    <aside id="panel">
      <h1>roma <span>香气卡片</span></h1>

      <!-- 小票：示例/生成结果的文字信息 -->
      <div id="receipt" class="receipt"></div>
      <div id="receiptLoading" class="hidden">
        <div class="skeleton skeleton-line" style="width:40%"></div>
        <div class="skeleton skeleton-line" style="width:70%"></div>
        <div class="skeleton skeleton-line" style="width:55%"></div>
      </div>

      <div id="inputDock">
        <form id="form">
          <div class="input-row">
            <textarea id="input" autocomplete="off" rows="2"
              placeholder="写一段香味描述，或粘一支香水的名字与香调…"></textarea>
            <select id="model" aria-label="模型"></select>
          </div>
          <label class="notes-toggle"><input type="checkbox" id="showNotes" /> 显示香调</label>
          <button id="gen" type="submit">生成</button>
        </form>
        <p id="status" role="status"></p>
      </div>
    </aside>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
