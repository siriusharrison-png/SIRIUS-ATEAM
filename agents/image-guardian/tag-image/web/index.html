<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片打标签工作台</title>
  <style>
    :root {
      --bg: #f4f4f5;
      --card: #ffffff;
      --ink: #18181b;
      --muted: #71717a;
      --line: #e4e4e7;
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
      --ok: #16a34a;
      --err: #dc2626;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      padding: 32px 20px 80px;
    }
    .wrap { max-width: 920px; margin: 0 auto; }
    header { margin-bottom: 24px; }
    h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .key-warn {
      display: none;
      margin-top: 12px; padding: 10px 14px;
      background: #fef2f2; color: var(--err);
      border: 1px solid #fecaca; border-radius: 8px;
      font-size: 13px;
    }

    .drop {
      background: var(--card);
      border: 2px dashed var(--line);
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .drop:hover { border-color: var(--accent); }
    .drop.over { border-color: var(--accent); background: var(--accent-soft); }
    .drop-icon { font-size: 34px; opacity: .5; }
    .drop-title { font-size: 15px; font-weight: 550; margin-top: 10px; }
    .drop-hint { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
    input[type=file] { display: none; }

    .bar {
      display: none;
      align-items: center; gap: 12px;
      margin: 20px 0 8px;
    }
    .bar.show { display: flex; }
    .bar .count { font-size: 13px; color: var(--muted); flex: 1; }
    button {
      font: inherit; font-size: 13px; font-weight: 550;
      padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--card); color: var(--ink); cursor: pointer;
      transition: background .15s, border-color .15s, opacity .15s;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.primary:hover { opacity: .9; color: #fff; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .grid { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
    .row {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 14px;
      display: grid; grid-template-columns: 84px 1fr auto; gap: 14px;
      align-items: center;
    }
    .thumb {
      width: 84px; height: 84px; border-radius: 8px; object-fit: cover;
      background: var(--bg); border: 1px solid var(--line);
    }
    .row-main { min-width: 0; }
    .row-name {
      font-size: 12.5px; color: var(--muted); margin-bottom: 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tags {
      font-family: "SF Mono", Monaco, monospace; font-size: 12.5px;
      color: var(--accent); background: var(--accent-soft);
      padding: 8px 10px; border-radius: 6px; word-break: break-word;
    }
    .tags.pending { color: var(--muted); background: var(--bg); }
    .tags.error { color: var(--err); background: #fef2f2; }
    .row-actions { display: flex; flex-direction: column; gap: 6px; }
    .row-actions button { padding: 6px 12px; font-size: 12px; }
    .spin {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid var(--line); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: #fff; padding: 10px 18px;
      border-radius: 8px; font-size: 13px; opacity: 0;
      transition: opacity .2s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>图片打标签工作台</h1>
      <div class="sub">摄影师 · 拖入照片，自动生成 Unsplash 友好标签。点标签即复制，或一键导出 CSV。</div>
      <div class="key-warn" id="keyWarn">⚠️ 未检测到 Imagga 凭证，打标签会失败。请在 .env.local 填入 IMAGGA_API_KEY / IMAGGA_API_SECRET 后重启工作台。</div>
    </header>

    <div class="drop" id="drop">
      <div class="drop-icon">🖼️</div>
      <div class="drop-title">把照片拖到这里，或点击选择</div>
      <div class="drop-hint">支持多张 · jpg / png / webp / gif</div>
    </div>
    <input type="file" id="file" accept="image/*" multiple>

    <div class="bar" id="bar">
      <span class="count" id="count"></span>
      <button id="copyAll">复制全部标签</button>
      <button class="primary" id="exportCsv">导出 CSV</button>
      <button id="clear">清空</button>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
