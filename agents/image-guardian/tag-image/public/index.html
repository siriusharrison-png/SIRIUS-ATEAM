<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片标签工具 - Tag Image</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 800px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 2px solid #eee;
    }

    .tab-btn {
      padding: 12px 20px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      color: #666;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }

    .tab-btn.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }

    textarea, input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    textarea:focus, input[type="file"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    .url-hint {
      font-size: 12px;
      color: #999;
      margin-top: 6px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    button {
      flex: 1;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .results {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }

    .result-item {
      background: #f9f9f9;
      padding: 16px;
      border-radius: 6px;
      margin-bottom: 12px;
      border-left: 4px solid #667eea;
    }

    .result-item.error {
      border-left-color: #ff6b6b;
      background: #fff5f5;
    }

    .result-item.success {
      border-left-color: #51cf66;
      background: #f1fdf4;
    }

    .result-filename {
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      word-break: break-all;
    }

    .result-tags {
      font-family: 'Monaco', 'Courier New', monospace;
      background: white;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      color: #667eea;
      word-break: break-all;
      border: 1px solid #e0e0e0;
    }

    .result-error {
      color: #ff6b6b;
      font-size: 13px;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f0f0f0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading.active {
      display: block;
    }

    .copy-btn {
      padding: 4px 8px;
      font-size: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 8px;
    }

    .copy-btn:hover {
      background: #764ba2;
    }

    .success-msg {
      color: #51cf66;
      font-size: 12px;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏷️ 图片标签工具</h1>
    <p class="subtitle">使用 Imagga AI 为图片生成 Unsplash 友好的标签</p>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('urls')">URL 链接</button>
      <button class="tab-btn" onclick="switchTab('upload')">上传文件</button>
    </div>

    <!-- URL Tab -->
    <div id="urls" class="tab-content active">
      <div class="form-group">
        <label>图片 URL（每行一个）</label>
        <textarea id="urlInput" placeholder="https://example.com/image1.jpg&#10;https://example.com/image2.jpg"></textarea>
        <p class="url-hint">支持 JPG、PNG、GIF、WebP 格式</p>
      </div>
      <div class="button-group">
        <button class="btn-primary" onclick="tagFromUrls()">生成标签</button>
        <button class="btn-secondary" onclick="clearUrls()">清空</button>
      </div>
    </div>

    <!-- Upload Tab -->
    <div id="upload" class="tab-content">
      <div class="form-group">
        <label>选择图片文件</label>
        <input type="file" id="fileInput" multiple accept="image/*">
        <p class="url-hint">支持批量上传，最大 50MB 单个文件</p>
      </div>
      <div class="button-group">
        <button class="btn-primary" onclick="tagFromFiles()">生成标签</button>
        <button class="btn-secondary" onclick="clearFiles()">清空</button>
      </div>
    </div>

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p style="margin-top: 10px; color: #666;">处理中...</p>
    </div>

    <!-- Results -->
    <div class="results" id="results" style="display: none;">
      <h2 style="margin-bottom: 20px; color: #333;">结果</h2>
      <div id="resultsList"></div>
    </div>
  </div>

  <script>
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');
    }

    function showLoading(show) {
      document.getElementById('loading').classList.toggle('active', show);
    }

    function showResults(results) {
      const resultsDiv = document.getElementById('results');
      const resultsList = document.getElementById('resultsList');
      resultsList.innerHTML = '';

      results.forEach(result => {
        const item = document.createElement('div');
        item.className = `result-item ${result.success ? 'success' : 'error'}`;

        if (result.success) {
          item.innerHTML = `
            <div class="result-filename">${result.filename || result.url}</div>
            <div style="display: flex; align-items: center;">
              <div class="result-tags">${result.tags}</div>
              <button class="copy-btn" onclick="copyToClipboard('${result.tags.replace(/'/g, "\\'")}')">复制</button>
              <span class="success-msg" id="msg-${Math.random()}" style="display: none;">已复制</span>
            </div>
          `;
        } else {
          item.innerHTML = `
            <div class="result-filename">${result.filename || result.url}</div>
            <div class="result-error">❌ ${result.error}</div>
          `;
        }

        resultsList.appendChild(item);
      });

      resultsDiv.style.display = 'block';
      resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        const msgEl = event.target.nextElementSibling;
        msgEl.style.display = 'inline';
        setTimeout(() => msgEl.style.display = 'none', 2000);
      });
    }

    async function tagFromUrls() {
      const urls = document.getElementById('urlInput').value
        .split('\n')
        .map(url => url.trim())
        .filter(url => url.length > 0);

      if (urls.length === 0) {
        alert('请输入至少一个 URL');
        return;
      }

      showLoading(true);
      try {
        const response = await fetch('/api/tag', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ urls })
        });

        const results = await response.json();
        showResults(results);
      } catch (error) {
        alert('错误: ' + error.message);
      } finally {
        showLoading(false);
      }
    }

    async function tagFromFiles() {
      const files = document.getElementById('fileInput').files;
      if (files.length === 0) {
        alert('请选择至少一个文件');
        return;
      }

      const formData = new FormData();
      for (let file of files) {
        formData.append('images', file);
      }

      showLoading(true);
      try {
        const response = await fetch('/api/tag', {
          method: 'POST',
          body: formData
        });

        const results = await response.json();
        showResults(results);
      } catch (error) {
        alert('错误: ' + error.message);
      } finally {
        showLoading(false);
      }
    }

    function clearUrls() {
      document.getElementById('urlInput').value = '';
    }

    function clearFiles() {
      document.getElementById('fileInput').value = '';
    }
  </script>
</body>
</html>
