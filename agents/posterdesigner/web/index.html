<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海报设计师 · 工作台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --paper: #f4f1ea; --ink: #1a1a1a; --muted: #8a8378;
    --line: #d8d2c6; --accent: #1d3fae; --card: #fbf9f4;
  }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--paper); color: var(--ink);
    line-height: 1.6; padding: 40px 24px; min-height: 100vh;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { margin-bottom: 32px; border-bottom: 1px solid var(--line); padding-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 28px; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  .drop {
    border: 1.5px dashed var(--line); border-radius: 8px; padding: 28px 16px;
    text-align: center; color: var(--muted); cursor: pointer; transition: .15s;
    font-size: 13px; background: #fff;
  }
  .drop.over { border-color: var(--accent); color: var(--accent); background: #f0f3ff; }
  .drop img { max-width: 100%; max-height: 220px; border-radius: 4px; margin-top: 4px; }
  label.field { display: block; font-size: 12px; color: var(--muted); margin: 16px 0 6px; letter-spacing: .3px; }
  input[type=text], select {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 14px; background: #fff; color: var(--ink); font-family: inherit;
  }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .btn {
    width: 100%; margin-top: 20px; padding: 12px; border: none; border-radius: 7px;
    background: var(--ink); color: #fff; font-size: 15px; cursor: pointer; letter-spacing: 1px;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 10px; text-align: center; }
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 60px 0; }
  .result { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .result img { width: 100%; display: block; cursor: zoom-in; background: #fff; }
  .result .meta { padding: 10px 12px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
  .result .acts { display: flex; gap: 8px; padding: 0 12px 12px; }
  .result .acts a, .result .acts button {
    flex: 1; text-align: center; font-size: 12px; padding: 6px; border-radius: 5px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); text-decoration: none; cursor: pointer;
  }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff;
    border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overlay { position: fixed; inset: 0; background: rgba(20,18,15,.85); display: none;
    align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; }
  .overlay img { max-width: 92vw; max-height: 92vh; }
  .err { color: #a33; font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>海报设计师 · 工作台</h1>
    <div class="sub">拖张图进来，出一张极简 zine 纸感海报。基于 gc-minimal-zine-poster 风格。</div>
  </header>
  <div class="layout">
    <div class="panel">
      <div id="drop" class="drop">
        <div id="dropText">把图片拖到这里<br>或点击选择（可留空，纯主题生成）</div>
        <input id="file" type="file" accept="image/*" hidden>
      </div>
      <label class="field">主题 / 核心意象（可选，留空按文件名）</label>
      <input id="subject" type="text" placeholder="例：海边的旧信箱">
      <label class="field">海报内短句（可选，宜短）</label>
      <input id="text" type="text" placeholder="例：still raining">
      <label class="field">锁定布局（可选，默认自动避开上次）</label>
      <select id="layout"><option value="">自动</option></select>
      <div class="row"><input id="mono" type="checkbox"><label for="mono">单色模式（弱化高饱和色）</label></div>
      <button id="go" class="btn">生 成 海 报</button>
      <div id="err" class="err"></div>
      <div class="hint">出图走本地服务 → 网关 gpt-image-2，通常几十秒。</div>
    </div>
    <div class="panel">
      <div id="results" class="results"><div class="empty">还没有作品。左边生成第一张吧。</div></div>
    </div>
  </div>
</div>
<div id="overlay" class="overlay"><img id="overlayImg" src="" alt=""></div>
<script>
const $ = (id) => document.getElementById(id);
let pickedFile = null;

// 加载布局下拉
fetch('/api/layouts').then(r => r.json()).then(list => {
  const sel = $('layout');
  list.forEach(it => {
    const o = document.createElement('option');
    o.value = it.key; o.textContent = it.key + ' — ' + it.desc;
    sel.appendChild(o);
  });
}).catch(() => {});

// 拖拽 + 点击选图
const drop = $('drop'), fileInput = $('file');
drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) setFile(fileInput.files[0]); });

function setFile(f) {
  pickedFile = f;
  const reader = new FileReader();
  reader.onload = e => {
    $('dropText').innerHTML = '';
    const img = document.createElement('img');
    img.src = e.target.result;
    $('dropText').appendChild(img);
    const cap = document.createElement('div');
    cap.style.cssText = 'margin-top:8px;font-size:12px';
    cap.textContent = f.name + '（点击可换图）';
    $('dropText').appendChild(cap);
  };
  reader.readAsDataURL(f);
}

// 生成
$('go').addEventListener('click', async () => {
  const btn = $('go'); $('err').textContent = '';
  btn.disabled = true;
  const label = btn.textContent;
  btn.innerHTML = '<span class="spinner"></span> 出图中…';
  const fd = new FormData();
  if (pickedFile) fd.append('image', pickedFile);
  fd.append('subject', $('subject').value);
  fd.append('text', $('text').value);
  fd.append('lock_layout', $('layout').value);
  fd.append('mono', $('mono').checked ? '1' : '0');
  try {
    const r = await fetch('/api/generate', { method: 'POST', body: fd });
    const data = await r.json();
    if (data.ok) addResult(data);
    else $('err').textContent = data.error || '出图失败';
  } catch (e) {
    $('err').textContent = '请求失败：' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
});

function addResult(data) {
  const box = $('results');
  const empty = box.querySelector('.empty');
  if (empty) empty.remove();
  const el = document.createElement('div');
  el.className = 'result';
  el.innerHTML = `
    <img src="${data.url}" alt="poster" loading="lazy">
    <div class="meta">「${data.subject}」<br>${data.recipe}</div>
    <div class="acts">
      <a href="${data.url}" download>下载</a>
      <button>换配方重出</button>
    </div>`;
  el.querySelector('img').addEventListener('click', () => showOverlay(data.url));
  el.querySelector('button').addEventListener('click', () => regen(data.subject));
  box.prepend(el);
}

function regen(subject) {
  $('subject').value = subject;
  $('layout').value = '';   // 放开锁定，让它自动避开上次布局
  $('go').click();
}

function showOverlay(url) {
  $('overlayImg').src = url;
  $('overlay').style.display = 'flex';
}
$('overlay').addEventListener('click', () => { $('overlay').style.display = 'none'; });
</script>
</body>
</html>
