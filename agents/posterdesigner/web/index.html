<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海报设计师 · 工作台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --paper: #f4f1ea; --ink: #1a1a1a; --muted: #8a8378;
    --line: #d8d2c6; --accent: #1d3fae; --card: #fbf9f4;
  }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--paper); color: var(--ink);
    line-height: 1.6; padding: 40px 24px; min-height: 100vh;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { margin-bottom: 32px; border-bottom: 1px solid var(--line); padding-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 28px; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab {
    flex: 1; padding: 9px 10px; border: 1px solid var(--line); border-radius: 7px;
    background: #fff; color: var(--muted); font-size: 13px; cursor: pointer;
    text-align: center; transition: .15s; font-family: inherit; letter-spacing: .3px;
  }
  .tab:hover { border-color: var(--accent); color: var(--accent); }
  .tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .skill-desc { font-size: 12px; color: var(--muted); margin-bottom: 4px; line-height: 1.5; }
  .req-note { font-size: 11px; color: #a33; margin-top: 8px; display: none; }
  .req-note.show { display: block; }
  [data-field] { display: none; }
  [data-field].on { display: block; }
  .row[data-field] { display: none; }
  .row[data-field].on { display: flex; }
  .drop {
    border: 1.5px dashed var(--line); border-radius: 8px; padding: 28px 16px;
    text-align: center; color: var(--muted); cursor: pointer; transition: .15s;
    font-size: 13px; background: #fff;
  }
  .drop.over { border-color: var(--accent); color: var(--accent); background: #f0f3ff; }
  .drop img { max-width: 100%; max-height: 220px; border-radius: 4px; margin-top: 4px; }
  label.field { display: block; font-size: 12px; color: var(--muted); margin: 16px 0 6px; letter-spacing: .3px; }
  input[type=text], select {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 14px; background: #fff; color: var(--ink); font-family: inherit;
  }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .btn {
    width: 100%; margin-top: 20px; padding: 12px; border: none; border-radius: 7px;
    background: var(--ink); color: #fff; font-size: 15px; cursor: pointer; letter-spacing: 1px;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 10px; text-align: center; }
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 60px 0; }
  .result { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .result .thumb { position: relative; }
  .result img { width: 100%; display: block; cursor: zoom-in; background: #fff; }
  .result .tip {
    position: absolute; inset: 0; padding: 12px 14px; box-sizing: border-box;
    background: rgba(20,18,15,.82); color: #f4f1ea; font-size: 11px; line-height: 1.7;
    display: flex; flex-direction: column; justify-content: flex-end;
    opacity: 0; transition: opacity .15s; pointer-events: none;
  }
  .result .thumb:hover .tip { opacity: 1; }
  .result .tip b { color: #fff; font-weight: 600; }
  .result .acts { display: flex; gap: 8px; padding: 12px; }
  .result .acts a, .result .acts button {
    flex: 1; text-align: center; font-size: 12px; padding: 6px; border-radius: 5px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); text-decoration: none; cursor: pointer;
  }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff;
    border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overlay { position: fixed; inset: 0; background: rgba(20,18,15,.85); display: none;
    align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; }
  .overlay img { max-width: 92vw; max-height: 92vh; }
  .err { color: #a33; font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="layout">
    <div class="panel">
      <div id="tabs" class="tabs"></div>
      <div id="skillDesc" class="skill-desc"></div>
      <div id="drop" class="drop">
        <div id="dropText">把图片拖到这里<br>或点击选择（可留空，纯主题生成）</div>
        <input id="file" type="file" accept="image/*" hidden>
      </div>
      <div id="reqNote" class="req-note">此风格需要一张照片作为唯一内容来源，请先上传图片。</div>

      <div data-field="subject">
        <label class="field" id="subjectLabel">主题 / 核心意象（可选，留空按文件名）</label>
        <input id="subject" type="text" placeholder="例：海边的旧信箱">
      </div>
      <div data-field="text">
        <label class="field">海报内短句（可选，宜短）</label>
        <input id="text" type="text" placeholder="例：still raining">
      </div>
      <div data-field="layout">
        <label class="field">锁定布局（可选，默认自动避开上次）</label>
        <select id="layout"><option value="">自动</option></select>
      </div>
      <div class="row" data-field="mono"><input id="mono" type="checkbox"><label for="mono">单色模式（弱化高饱和色）</label></div>
      <div class="row" data-field="subtitle"><input id="subtitle" type="checkbox"><label for="subtitle">允许副标题（默认只出主标题）</label></div>

      <button id="go" class="btn">生 成 作 品</button>
      <div id="err" class="err"></div>
      <div class="hint">出图走本地服务 → 网关 gpt-image-2，通常几十秒。</div>
    </div>
    <div class="panel">
      <div id="results" class="results"><div class="empty">还没有作品。左边生成第一张吧。</div></div>
    </div>
  </div>
</div>
<div id="overlay" class="overlay"><img id="overlayImg" src="" alt=""></div>
<script>
const $ = (id) => document.getElementById(id);
let pickedFile = null;
let SKILLS = [];
let currentSkill = null;

// 加载 skill 列表 → 渲染 tab
fetch('/api/skills').then(r => r.json()).then(list => {
  SKILLS = list;
  const tabs = $('tabs');
  list.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === 0 ? ' active' : '');
    b.textContent = s.name;
    b.dataset.id = s.id;
    b.addEventListener('click', () => selectSkill(s.id));
    tabs.appendChild(b);
  });
  if (list.length) selectSkill(list[0].id);
}).catch(() => {});

// 加载布局下拉
fetch('/api/layouts').then(r => r.json()).then(list => {
  const sel = $('layout');
  list.forEach(it => {
    const o = document.createElement('option');
    o.value = it.key; o.textContent = it.key + ' — ' + it.desc;
    sel.appendChild(o);
  });
}).catch(() => {});

// 切换 skill：更新 tab 高亮、描述、字段显隐、照片必需提示、按钮态
function selectSkill(id) {
  const skill = SKILLS.find(s => s.id === id);
  if (!skill) return;
  currentSkill = skill;

  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.id === id);
  });
  $('skillDesc').textContent = skill.desc;

  // 字段显隐：按 skill.fields 白名单开关
  const on = new Set(skill.fields);
  document.querySelectorAll('[data-field]').forEach(el => {
    el.classList.toggle('on', on.has(el.dataset.field));
  });

  // 照片必需时：主题标签改措辞、拖拽区文案改
  if (skill.photoRequired) {
    $('dropText').dataset.hint = '把照片拖到这里<br>或点击选择（此风格必需）';
    if ($('subjectLabel')) $('subjectLabel').textContent = '意象提示（可选，辅助命名，不覆盖照片事实）';
  } else {
    $('dropText').dataset.hint = '把图片拖到这里<br>或点击选择（可留空，纯主题生成）';
    if ($('subjectLabel')) $('subjectLabel').textContent = '主题 / 核心意象（可选，留空按文件名）';
  }
  // 未选图时才刷新占位文案（已选图保留预览）
  if (!pickedFile) $('dropText').innerHTML = $('dropText').dataset.hint;

  refreshGate();
}

// 照片必需但未上传 → 禁用按钮 + 红字提示
function refreshGate() {
  const need = currentSkill && currentSkill.photoRequired && !pickedFile;
  $('reqNote').classList.toggle('show', !!need);
  $('go').disabled = !!need;
}

// 拖拽 + 点击选图
const drop = $('drop'), fileInput = $('file');
drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) setFile(fileInput.files[0]); });

function setFile(f) {
  pickedFile = f;
  const reader = new FileReader();
  reader.onload = e => {
    $('dropText').innerHTML = '';
    const img = document.createElement('img');
    img.src = e.target.result;
    $('dropText').appendChild(img);
    const cap = document.createElement('div');
    cap.style.cssText = 'margin-top:8px;font-size:12px';
    cap.textContent = f.name + '（点击可换图）';
    $('dropText').appendChild(cap);
  };
  reader.readAsDataURL(f);
  refreshGate();
}

// 生成
$('go').addEventListener('click', async () => {
  const btn = $('go'); $('err').textContent = '';
  btn.disabled = true;
  const label = btn.textContent;
  btn.innerHTML = '<span class="spinner"></span> 出图中…';
  const fd = new FormData();
  fd.append('skill', currentSkill ? currentSkill.id : 'zine');
  if (pickedFile) fd.append('image', pickedFile);
  fd.append('subject', $('subject').value);
  fd.append('text', $('text').value);
  fd.append('lock_layout', $('layout').value);
  fd.append('mono', $('mono').checked ? '1' : '0');
  fd.append('subtitle', $('subtitle').checked ? '1' : '0');
  try {
    const r = await fetch('/api/generate', { method: 'POST', body: fd });
    const data = await r.json();
    if (data.ok) addResult(data);
    else $('err').textContent = data.error || '出图失败';
  } catch (e) {
    $('err').textContent = '请求失败：' + e.message;
  } finally {
    btn.textContent = label;
    refreshGate();   // 按 skill/照片状态决定是否重新启用
  }
});

function addResult(data) {
  const box = $('results');
  const empty = box.querySelector('.empty');
  if (empty) empty.remove();
  const el = document.createElement('div');
  el.className = 'result';
  // editorial 无「配方」概念，重出即同图重跑；zine 则换配方
  const regenLabel = data.skill === 'editorial' ? '重新生成' : '换配方重出';
  el.innerHTML = `
    <div class="thumb">
      <img src="${data.url}" alt="poster" loading="lazy">
      <div class="tip">「<b>${data.subject}</b>」<br>${data.recipe}</div>
    </div>
    <div class="acts">
      <a href="${data.url}" download>下载</a>
      <button>${regenLabel}</button>
    </div>`;
  el.querySelector('img').addEventListener('click', () => showOverlay(data.url));
  el.querySelector('button').addEventListener('click', () => regen(data));
  box.prepend(el);
}

function regen(data) {
  // 切回该作品所用 skill，再触发一次生成
  if (data.skill && currentSkill && data.skill !== currentSkill.id) {
    selectSkill(data.skill);
  }
  if (data.skill !== 'editorial') {
    $('subject').value = data.subject || '';
    $('layout').value = '';   // 放开锁定，让它自动避开上次布局
  }
  if (!$('go').disabled) $('go').click();
}

function showOverlay(url) {
  $('overlayImg').src = url;
  $('overlay').style.display = 'flex';
}
$('overlay').addEventListener('click', () => { $('overlay').style.display = 'none'; });
</script>
</body>
</html>
