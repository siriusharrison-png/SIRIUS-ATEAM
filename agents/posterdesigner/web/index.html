<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海报设计师 · 工作台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --paper: #f4f1ea; --ink: #1a1a1a; --muted: #8a8378;
    --line: #d8d2c6; --accent: #1d3fae; --card: #fbf9f4;
  }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--paper); color: var(--ink);
    line-height: 1.6; padding: 40px 24px; min-height: 100vh;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { margin-bottom: 32px; border-bottom: 1px solid var(--line); padding-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 28px; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab {
    flex: 1; padding: 9px 10px; border: 1px solid var(--line); border-radius: 7px;
    background: #fff; color: var(--muted); font-size: 13px; cursor: pointer;
    text-align: center; transition: .15s; font-family: inherit; letter-spacing: .3px;
  }
  .tab:hover { border-color: var(--accent); color: var(--accent); }
  .tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .skill-desc { font-size: 12px; color: var(--muted); margin-bottom: 4px; line-height: 1.5; }
  .req-note { font-size: 11px; color: #a33; margin-top: 8px; display: none; }
  .req-note.show { display: block; }
  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .thumbs:empty { margin-top: 0; }
  .thumb-item { position: relative; aspect-ratio: 1; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); background: #fff; }
  .thumb-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-item .del {
    position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; line-height: 15px;
    text-align: center; border-radius: 50%; background: rgba(20,18,15,.72); color: #fff;
    font-size: 12px; cursor: pointer; border: none; padding: 0;
  }
  .thumb-item .del:hover { background: #a33; }
  .thumb-count { font-size: 11px; color: var(--muted); margin-top: 8px; text-align: right; }
  [data-field] { display: none; }
  [data-field].on { display: block; }
  .row[data-field] { display: none; }
  .row[data-field].on { display: flex; }
  .drop {
    border: 1.5px dashed var(--line); border-radius: 8px; padding: 28px 16px;
    text-align: center; color: var(--muted); cursor: pointer; transition: .15s;
    font-size: 13px; background: #fff;
  }
  .drop.over { border-color: var(--accent); color: var(--accent); background: #f0f3ff; }
  .drop img { max-width: 100%; max-height: 220px; border-radius: 4px; margin-top: 4px; }
  label.field { display: block; font-size: 12px; color: var(--muted); margin: 16px 0 6px; letter-spacing: .3px; }
  input[type=text], select {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 14px; background: #fff; color: var(--ink); font-family: inherit;
  }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .btn {
    width: 100%; margin-top: 20px; padding: 12px; border: none; border-radius: 7px;
    background: var(--ink); color: #fff; font-size: 15px; cursor: pointer; letter-spacing: 1px;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 10px; text-align: center; }
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 60px 0; }
  .result { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .result .thumb { position: relative; }
  .result img { width: 100%; display: block; cursor: zoom-in; background: #fff; }
  .result .tip {
    position: absolute; inset: 0; padding: 12px 14px; box-sizing: border-box;
    background: rgba(20,18,15,.82); color: #f4f1ea; font-size: 11px; line-height: 1.7;
    display: flex; flex-direction: column; justify-content: flex-end;
    opacity: 0; transition: opacity .15s; pointer-events: none;
  }
  .result .thumb:hover .tip { opacity: 1; }
  .result .tip b { color: #fff; font-weight: 600; }
  .result .acts { display: flex; gap: 8px; padding: 12px; }
  .result .acts a, .result .acts button {
    flex: 1; text-align: center; font-size: 12px; padding: 6px; border-radius: 5px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); text-decoration: none; cursor: pointer;
  }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff;
    border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overlay { position: fixed; inset: 0; background: rgba(20,18,15,.85); display: none;
    align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; }
  .overlay img { max-width: 92vw; max-height: 92vh; }
  .err { color: #a33; font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="layout">
    <div class="panel">
      <div id="tabs" class="tabs"></div>
      <div id="skillDesc" class="skill-desc"></div>
      <div id="drop" class="drop">
        <div id="dropText">把图片拖到这里<br>或点击选择（可多张，可留空纯主题生成）</div>
        <input id="file" type="file" accept="image/*" multiple hidden>
      </div>
      <div id="thumbs" class="thumbs"></div>
      <div id="reqNote" class="req-note">此风格需要一张照片作为唯一内容来源，请先上传图片。</div>

      <div data-field="subject">
        <label class="field" id="subjectLabel">主题 / 核心意象（可选，留空按文件名）</label>
        <input id="subject" type="text" placeholder="例：海边的旧信箱">
      </div>
      <div data-field="text">
        <label class="field">海报内短句（可选，宜短）</label>
        <input id="text" type="text" placeholder="例：still raining">
      </div>
      <div data-field="layout">
        <label class="field">锁定布局（可选，默认自动避开上次）</label>
        <select id="layout"><option value="">自动</option></select>
      </div>
      <div data-field="seal_shape">
        <label class="field">图章形状</label>
        <select id="seal_shape"></select>
      </div>
      <div data-field="seal_corner">
        <label class="field">图章位置</label>
        <select id="seal_corner"></select>
      </div>
      <div data-field="splice">
        <label class="field">拼接方向</label>
        <select id="splice"></select>
      </div>
      <div class="row" data-field="mono"><input id="mono" type="checkbox"><label for="mono">单色模式（弱化高饱和色）</label></div>
      <div class="row" data-field="subtitle"><input id="subtitle" type="checkbox"><label for="subtitle">允许副标题（默认只出主标题）</label></div>

      <button id="go" class="btn">生 成 作 品</button>
      <div id="err" class="err"></div>
      <div class="hint">出图走本地服务 → 网关 gpt-image-2，通常几十秒。</div>
    </div>
    <div class="panel">
      <div id="results" class="results"><div class="empty">还没有作品。左边生成第一张吧。</div></div>
    </div>
  </div>
</div>
<div id="overlay" class="overlay"><img id="overlayImg" src="" alt=""></div>
<script>
const $ = (id) => document.getElementById(id);
let pickedFiles = [];     // 多图：批量上传的文件列表
let SKILLS = [];
let currentSkill = null;

// 加载 skill 列表 → 渲染 tab
fetch('/api/skills').then(r => r.json()).then(list => {
  SKILLS = list;
  const tabs = $('tabs');
  list.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === 0 ? ' active' : '');
    b.textContent = s.name;
    b.dataset.id = s.id;
    b.addEventListener('click', () => selectSkill(s.id));
    tabs.appendChild(b);
  });
  if (list.length) selectSkill(list[0].id);
}).catch(() => {});

// 加载布局下拉
fetch('/api/layouts').then(r => r.json()).then(list => {
  const sel = $('layout');
  list.forEach(it => {
    const o = document.createElement('option');
    o.value = it.key; o.textContent = it.key + ' — ' + it.desc;
    sel.appendChild(o);
  });
}).catch(() => {});

// 切换 skill：更新 tab 高亮、描述、字段显隐、照片必需提示、按钮态
function selectSkill(id) {
  const skill = SKILLS.find(s => s.id === id);
  if (!skill) return;
  currentSkill = skill;

  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.id === id);
  });
  $('skillDesc').textContent = skill.desc;

  // 字段显隐：按 skill.fields 白名单开关
  const on = new Set(skill.fields);
  document.querySelectorAll('[data-field]').forEach(el => {
    el.classList.toggle('on', on.has(el.dataset.field));
  });

  // 照片必需时：拖拽区文案改（多图版）
  if (skill.photoRequired) {
    $('dropText').dataset.hint = '把照片拖到这里<br>或点击选择（可多张，此风格必需）';
  } else {
    $('dropText').dataset.hint = '把图片拖到这里<br>或点击选择（可多张，可留空纯主题生成）';
  }

  // 每个 skill 各自的 subject 标签与输入框占位（提示词引导）
  const ph = skill.placeholders || {};
  if ($('subjectLabel') && skill.subjectLabel) $('subjectLabel').textContent = skill.subjectLabel;
  if (ph.subject) $('subject').placeholder = ph.subject;
  if (ph.text) $('text').placeholder = ph.text;

  // skill 自带的下拉选项（如 stamp 的图章形状/位置/拼接方向）
  // 选项来自后端 compiler，前端不写死，避免两处命名漂移
  const opts = skill.options || {};
  Object.keys(opts).forEach(key => {
    const sel = $(key);
    if (!sel) return;
    const keep = sel.value;          // 切 tab 回来时尽量保留上次选择
    sel.innerHTML = '';
    opts[key].forEach(o => {
      const op = document.createElement('option');
      op.value = o.value; op.textContent = o.label;
      sel.appendChild(op);
    });
    if (keep && opts[key].some(o => o.value === keep)) sel.value = keep;
  });

  // 未选图时才刷新占位文案（已选图保留缩略图网格）
  if (!pickedFiles.length) $('dropText').innerHTML = $('dropText').dataset.hint;

  refreshGate();
}

// 照片必需但未上传 → 禁用按钮 + 红字提示
function refreshGate() {
  const need = currentSkill && currentSkill.photoRequired && !pickedFiles.length;
  $('reqNote').classList.toggle('show', !!need);
  $('go').disabled = !!need;
  // 生成按钮文案随张数变化
  const n = pickedFiles.length;
  $('go').textContent = n > 1 ? `批 量 生 成 ${n} 张` : '生 成 作 品';
}

// 拖拽 + 点击选图（多图）
const drop = $('drop'), fileInput = $('file');
drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) addFiles(fileInput.files);
  fileInput.value = '';   // 清空以便再次选到同名文件
});

// 追加图片（去重：按 name+size），重画缩略图网格
function addFiles(fileList) {
  for (const f of fileList) {
    if (!f.type.startsWith('image/')) continue;
    const dup = pickedFiles.some(p => p.name === f.name && p.size === f.size);
    if (!dup) pickedFiles.push(f);
  }
  renderThumbs();
  refreshGate();
}

function removeFile(idx) {
  pickedFiles.splice(idx, 1);
  renderThumbs();
  refreshGate();
}

function renderThumbs() {
  const box = $('thumbs');
  box.innerHTML = '';
  if (!pickedFiles.length) {
    $('dropText').innerHTML = $('dropText').dataset.hint || '把图片拖到这里<br>或点击选择';
    return;
  }
  // 拖拽区收起为一行提示，缩略图移到网格
  $('dropText').innerHTML = `已选 ${pickedFiles.length} 张，点此继续添加`;
  pickedFiles.forEach((f, i) => {
    const item = document.createElement('div');
    item.className = 'thumb-item';
    const img = document.createElement('img');
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    reader.readAsDataURL(f);
    img.title = f.name;
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '×'; del.title = '移除';
    del.addEventListener('click', ev => { ev.stopPropagation(); removeFile(i); });
    item.appendChild(img); item.appendChild(del);
    box.appendChild(item);
  });
}

// 组装一次出图的表单。
// opts.file: 新上传的图；opts.reuseUpload: 复用已存 upload 文件名（重出用）；
// opts.override: 覆盖表单字段（重出时用作品自身的 skill/subject，而非当前面板值）。
function buildForm(opts) {
  opts = opts || {};
  const o = opts.override || {};
  const fd = new FormData();
  fd.append('skill', o.skill || (currentSkill ? currentSkill.id : 'zine'));
  if (opts.file) fd.append('image', opts.file);
  if (opts.reuseUpload) fd.append('reuse_upload', opts.reuseUpload);
  fd.append('subject', o.subject != null ? o.subject : $('subject').value);
  fd.append('text', o.text != null ? o.text : $('text').value);
  fd.append('lock_layout', o.lock_layout != null ? o.lock_layout : $('layout').value);
  fd.append('mono', o.mono != null ? o.mono : ($('mono').checked ? '1' : '0'));
  fd.append('subtitle', o.subtitle != null ? o.subtitle : ($('subtitle').checked ? '1' : '0'));
  // stamp 三条轴：重出时用作品自身的取值，否则读当前面板
  ['seal_shape', 'seal_corner', 'splice'].forEach(k => {
    const el = $(k);
    fd.append(k, o[k] != null ? o[k] : (el ? el.value : ''));
  });
  return fd;
}

// 出一张图；成功 append 结果，失败返回错误文案
async function generateOne(opts) {
  try {
    const r = await fetch('/api/generate', { method: 'POST', body: buildForm(opts) });
    const data = await r.json();
    if (data.ok) { addResult(data); return null; }
    return data.error || '出图失败';
  } catch (e) {
    // fetch 抛异常＝请求根本没到服务端（最常见就是本地服务已停）。
    // 浏览器只给一句 "Failed to fetch"，对使用者没有信息量，这里换成能照着做的话。
    const offline = /failed to fetch|networkerror|load failed/i.test(e.message || '');
    if (offline) {
      return '连不上本地服务 —— 出图服务已经停了（多半是那个终端窗口被关掉了）。'
           + '重新双击 <b>workbench.command</b> 启动，然后刷新这个页面重试。';
    }
    return '请求失败：' + e.message;
  }
}

// 页面重新可见时探一下服务还在不在，早点提示而不是等用户点了生成才报错
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  fetch('/api/skills', { method: 'GET' }).catch(() => {
    $('err').innerHTML = '连不上本地服务 —— 出图服务可能已停止。'
      + '重新双击 <b>workbench.command</b> 启动后刷新页面。';
  });
});

// 生成：有多张图则串行批量（避免网关限流），无图则纯主题单次
$('go').addEventListener('click', async () => {
  const btn = $('go'); $('err').textContent = '';
  btn.disabled = true;
  const label = pickedFiles.length > 1 ? `批 量 生 成 ${pickedFiles.length} 张` : '生 成 作 品';

  const jobs = pickedFiles.length ? [...pickedFiles] : [null];
  const errors = [];
  try {
    for (let i = 0; i < jobs.length; i++) {
      btn.innerHTML = jobs.length > 1
        ? `<span class="spinner"></span> 出图中… ${i + 1}/${jobs.length}`
        : '<span class="spinner"></span> 出图中…';
      const err = await generateOne({ file: jobs[i] });
      if (err) errors.push((jobs[i] ? jobs[i].name + '：' : '') + err);
    }
    if (errors.length) $('err').innerHTML = errors.join('<br>');
  } finally {
    btn.textContent = label;
    refreshGate();   // 按 skill/照片状态决定是否重新启用
  }
});

function addResult(data) {
  const box = $('results');
  const empty = box.querySelector('.empty');
  if (empty) empty.remove();
  const el = document.createElement('div');
  el.className = 'result';
  // 只有 zine 有种子配方可换；其余 skill 重出即同参数同图重跑
  const regenLabel = data.skill === 'zine' ? '换配方重出' : '重新生成';
  el.innerHTML = `
    <div class="thumb">
      <img src="${data.url}" alt="poster" loading="lazy">
      <div class="tip">「<b>${data.subject}</b>」<br>${data.recipe}</div>
    </div>
    <div class="acts">
      <a href="${data.url}" download>下载</a>
      <button>${regenLabel}</button>
    </div>`;
  el.querySelector('img').addEventListener('click', () => showOverlay(data.url));
  const regenBtn = el.querySelector('button');
  regenBtn.addEventListener('click', () => regen(data, regenBtn));
  box.prepend(el);
}

// 重出单张历史作品：复用该作品原图（后端 upload），用作品自身的 skill/subject，
// 与当前面板选图、批量队列互不影响。
async function regen(data, btnEl) {
  const override = { skill: data.skill, subject: data.subject || '' };
  // zine：放开布局锁定，让它自动避开上次；其余无种子配方，同参数重跑
  if (data.skill === 'zine') override.lock_layout = '';
  // stamp：沿用该作品自己的三条轴，不受当前面板选择影响
  if (data.skill === 'stamp') {
    override.seal_shape = data.seal_shape || '';
    override.seal_corner = data.seal_corner || '';
    override.splice = data.splice || '';
  }
  const oldText = btnEl ? btnEl.textContent : '';
  if (btnEl) { btnEl.disabled = true; btnEl.innerHTML = '<span class="spinner"></span>'; }
  const err = await generateOne({ reuseUpload: data.upload || '', override });
  if (btnEl) { btnEl.disabled = false; btnEl.textContent = oldText; }
  if (err) $('err').innerHTML = err;
}

function showOverlay(url) {
  $('overlayImg').src = url;
  $('overlay').style.display = 'flex';
}
$('overlay').addEventListener('click', () => { $('overlay').style.display = 'none'; });
</script>
</body>
</html>
