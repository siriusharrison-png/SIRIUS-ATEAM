name: Secretary Daily Report

on:
  schedule:
    # 北京时间 18:00 = UTC 10:00
    - cron: '3 10 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '日期 (YYYY-MM-DD，留空则用今天)'
        required: false
        default: ''

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SIRIUS-ATEAM
        uses: actions/checkout@v4

      - name: Clone claude-config (private)
        run: |
          git clone https://x-access-token:${{ secrets.CONFIG_REPO_TOKEN }}@github.com/siriusharrison-png/claude-config.git /tmp/claude-config

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Sync device insights (if available)
        run: |
          # 尝试从设备同步 insights（如果本地有数据）
          if [ -d "$HOME/.claude/usage-data/devices" ]; then
            for device_dir in $HOME/.claude/usage-data/devices/*/daily-insights; do
              if [ -d "$device_dir" ]; then
                device_id=$(basename $(dirname "$device_dir"))
                dest="/tmp/claude-config/usage-data/devices/$device_id/daily-insights"
                mkdir -p "$dest"
                cp "$device_dir"/*.json "$dest/" 2>/dev/null || true
                echo "✅ 从 [$device_id] 同步数据"
              fi
            done
          fi
        continue-on-error: true

      - name: Run daily report
        env:
          USAGE_DATA_DIR: /tmp/claude-config/usage-data
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_SECRETARY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python /tmp/claude-config/scripts/merge-daily-insights.py "${{ github.event.inputs.date }}"
          else
            python /tmp/claude-config/scripts/merge-daily-insights.py
          fi

