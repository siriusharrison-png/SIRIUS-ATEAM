name: Secretary Daily Report

on:
  schedule:
    # 北京时间 18:00 = UTC 10:00
    - cron: '3 10 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '日期 (YYYY-MM-DD，留空则用今天)'
        required: false
        default: ''

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Clone claude-config (private)
        run: |
          git clone https://x-access-token:${{ secrets.CONFIG_REPO_TOKEN }}@github.com/siriusharrison-png/claude-config.git /tmp/claude-config

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run daily report
        env:
          USAGE_DATA_DIR: /tmp/claude-config/usage-data
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_SECRETARY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python /tmp/claude-config/scripts/merge-daily-insights.py "${{ github.event.inputs.date }}"
          else
            python /tmp/claude-config/scripts/merge-daily-insights.py
          fi
