name: Secretary Daily Report

on:
  schedule:
    # 北京时间 18:00 = UTC 10:00
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '日期 (YYYY-MM-DD，留空则用今天)'
        required: false
        default: ''

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SIRIUS-ATEAM
        uses: actions/checkout@v4

      - name: Clone claude-config (private)
        run: |
          git clone https://x-access-token:${{ secrets.CONFIG_REPO_TOKEN }}@github.com/siriusharrison-png/claude-config.git /tmp/claude-config

      - name: Collect usage data from all device branches
        run: |
          # 每台设备把自己的用量数据推到 device/<设备ID> 分支（见
          # docs/superpowers/specs/2026-08-15-multi-device-usage-sync-design.md）。
          # 这里把所有设备分支的数据取出来，铺进 usage-data/devices/ 供汇总脚本读取。
          cd /tmp/claude-config
          git fetch origin '+refs/heads/device/*:refs/remotes/origin/device/*' 2>&1 | tail -3

          mkdir -p usage-data/devices
          FOUND=0
          for ref in $(git for-each-ref --format='%(refname)' 'refs/remotes/origin/device/*'); do
            DEV=${ref##*/}
            [ -n "$DEV" ] || continue
            # 只取该分支下属于这台设备的目录，避免任何越界
            if git archive "$ref" "usage-data/devices/$DEV" 2>/dev/null | tar -x -C . 2>/dev/null; then
              N=$(find "usage-data/devices/$DEV" -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
              echo "✅ 设备 [$DEV] 取到 $N 个数据文件"
              FOUND=$((FOUND+1))
            else
              echo "⚠️ 设备 [$DEV] 数据取出失败，跳过"
            fi
          done
          echo "共收集 $FOUND 台设备"
        continue-on-error: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Collect device insights from all machines
        run: |
          # 收集本地 Claude 设备的日报数据
          python3 << 'EOF'
          import os
          import json
          import glob
          from datetime import datetime, timedelta

          home = os.path.expanduser("~")
          usage_dir = os.path.join(home, ".claude/usage-data/devices")

          if os.path.exists(usage_dir):
              for device_dir in glob.glob(os.path.join(usage_dir, "*")):
                  daily_dir = os.path.join(device_dir, "daily-insights")
                  if os.path.isdir(daily_dir):
                      device_id = os.path.basename(device_dir)
                      dest = f"/tmp/claude-config/usage-data/devices/{device_id}/daily-insights"
                      os.makedirs(dest, exist_ok=True)

                      # 复制最近的日报数据（最近3天）
                      for json_file in glob.glob(os.path.join(daily_dir, "*.json")):
                          with open(json_file) as f:
                              data = json.load(f)
                              date_str = data.get('date', os.path.basename(json_file))
                              try:
                                  date = datetime.strptime(date_str, '%Y-%m-%d')
                                  if (datetime.now() - date).days <= 3:
                                      import shutil
                                      shutil.copy(json_file, dest)
                                      print(f"✅ 收集 [{device_id}] {date_str} 的数据")
                              except:
                                  pass
          EOF
        continue-on-error: true

      - name: Sync device insights from repository
        run: |
          # 从 SIRIUS-ATEAM 仓库中的设备数据同步
          if [ -d ".github/device-insights" ]; then
            mkdir -p /tmp/claude-config/usage-data/devices
            cp -r .github/device-insights/* /tmp/claude-config/usage-data/devices/ 2>/dev/null || true
            echo "✅ 从仓库同步设备数据"
          fi
          # 确保设备数据目录存在
          mkdir -p /tmp/claude-config/usage-data/devices
        continue-on-error: true

      - name: Run daily report
        env:
          USAGE_DATA_DIR: /tmp/claude-config/usage-data
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_SECRETARY }}
          REPORT_CONFIG: ${{ github.workspace }}/.github/config/daily-report-config.json
          DISABLE_CLAUDE_CODE_REPORT: 'true'
        run: |
          # 兼容 claude-config 仓库两种目录结构：优先 synced-scripts/，回退 scripts/
          SCRIPT=""
          for candidate in \
            /tmp/claude-config/synced-scripts/merge-daily-insights.py \
            /tmp/claude-config/scripts/merge-daily-insights.py; do
            if [ -f "$candidate" ]; then
              SCRIPT="$candidate"
              break
            fi
          done
          if [ -z "$SCRIPT" ]; then
            echo "::error::merge-daily-insights.py not found in claude-config (checked synced-scripts/ and scripts/)"
            exit 1
          fi
          echo "使用脚本: $SCRIPT"
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python "$SCRIPT" "${{ github.event.inputs.date }}"
          else
            python "$SCRIPT"
          fi

      - name: Send failure alert to Feishu
        if: failure()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_SECRETARY }}
        run: |
          python3 << 'EOF'
          import requests, os
          webhook = os.environ.get("FEISHU_WEBHOOK")
          if webhook:
              msg = {
                  "msg_type": "text",
                  "content": {
                      "text": f"🚨 Secretary Daily Report 失败\nRun: https://github.com/siriusharrison-png/SIRIUS-ATEAM/actions/runs/{os.environ.get('GITHUB_RUN_ID')}"
                  }
              }
              requests.post(webhook, json=msg, timeout=10)
          EOF

