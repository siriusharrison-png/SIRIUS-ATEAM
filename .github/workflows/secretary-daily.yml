name: Secretary Daily Report

on:
  schedule:
    # 北京时间 18:00 = UTC 10:00
    - cron: '3 10 * * *'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史以统计 commit

      - name: Collect today's changes
        id: changes
        run: |
          TODAY=$(date -u -d '+8 hours' '+%Y-%m-%d')
          echo "date=$TODAY" >> $GITHUB_OUTPUT

          # 获取今日 commit（北京时间）
          COMMITS=$(git log --since="$TODAY 00:00" --until="$TODAY 23:59" --pretty=format:"• %s" 2>/dev/null || echo "")

          if [ -z "$COMMITS" ]; then
            CONTENT="今日暂无代码变更"
          else
            # 统计数量
            COUNT=$(echo "$COMMITS" | wc -l | tr -d ' ')
            CONTENT="**SIRIUS-ATEAM** ($COUNT 条变更):\n$COMMITS"
          fi

          # 保存到文件（避免特殊字符问题）
          echo -e "$CONTENT" > /tmp/changes.txt
          echo "content<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/changes.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Push to Feishu
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_SECRETARY }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "错误: 未配置 FEISHU_WEBHOOK"
            exit 1
          fi

          # 读取变更内容
          CONTENT=$(cat /tmp/changes.txt | sed 's/"/\\"/g' | tr '\n' ' ')
          DATE="${{ steps.changes.outputs.date }}"

          # 构建消息
          curl -s -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"interactive\",
              \"card\": {
                \"header\": {
                  \"title\": {
                    \"tag\": \"plain_text\",
                    \"content\": \"小秘书日报 | $DATE\"
                  },
                  \"template\": \"green\"
                },
                \"elements\": [
                  {
                    \"tag\": \"div\",
                    \"text\": {
                      \"tag\": \"lark_md\",
                      \"content\": \"$CONTENT\"
                    }
                  }
                ]
              }
            }"

          echo "飞书推送完成"
