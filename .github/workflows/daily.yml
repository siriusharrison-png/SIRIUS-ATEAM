name: Daily Report

on:
  schedule:
    # 北京时间 09:00 = UTC 01:00
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r agents/image-guardian/requirements.txt
      - name: Run daily task
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          UNSPLASH_USERNAME: ${{ secrets.UNSPLASH_USERNAME }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_PHOTOGRAPHER }}
        run: python agents/image-guardian/scripts/run-daily-cloud.py
