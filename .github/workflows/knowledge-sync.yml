name: Knowledge Manager Sync

on:
  schedule:
    # 北京时间 08:00 = UTC 00:00（同步飞书）
    - cron: '0 0 * * *'
    # 北京时间 12:00 = UTC 04:00（同步 GitLab）
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sync-feishu:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * *'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r agents/knowledge-keeper/requirements.txt

      - name: Sync Feishu Docs
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_NODE_TOKEN: ${{ secrets.FEISHU_NODE_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python agents/knowledge-keeper/scripts/sync-feishu-docs.py

      - name: Send failure alert to Feishu
        if: failure()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_SECRETARY }}
        run: |
          python3 << 'EOF'
          import requests, os
          webhook = os.environ.get("FEISHU_WEBHOOK")
          if webhook:
              msg = {
                  "msg_type": "text",
                  "content": {
                      "text": f"🚨 Knowledge Sync (飞书) 失败\nRun: https://github.com/siriusharrison-png/SIRIUS-ATEAM/actions/runs/{os.environ.get('GITHUB_RUN_ID')}"
                  }
              }
              requests.post(webhook, json=msg, timeout=10)
          EOF

  sync-gitlab:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 4 * * *'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r agents/knowledge-keeper/requirements.txt

      - name: Sync GitLab Workspace
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python agents/knowledge-keeper/scripts/sync-gitlab-workspace.py

      - name: Send failure alert to Feishu
        if: failure()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_SECRETARY }}
        run: |
          python3 << 'EOF'
          import requests, os
          webhook = os.environ.get("FEISHU_WEBHOOK")
          if webhook:
              msg = {
                  "msg_type": "text",
                  "content": {
                      "text": f"🚨 Knowledge Sync (GitLab) 失败\nRun: https://github.com/siriusharrison-png/SIRIUS-ATEAM/actions/runs/{os.environ.get('GITHUB_RUN_ID')}"
                  }
              }
              requests.post(webhook, json=msg, timeout=10)
          EOF
